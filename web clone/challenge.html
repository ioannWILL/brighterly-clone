<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge - Brighterly</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="mission-page">
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html"><img src="https://cs.brighterly.com/_nuxt/brighterly.CIV4ES6z.svg" alt="Brighterly"></a>
            </div>
            <div class="user-profile">
                <div class="avatar">St</div>
                <span class="username">Stefaniia</span>
            </div>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="container">
            <div id="challenge-container" class="challenge-card">
                <span id="question-count" class="question-label">Question 1 of 7 (0 asked / 0 correct)</span>
                <h2 id="question-text" class="question-text">Loading question...</h2>
                
                <div id="options-grid" class="options-grid">
                    <!-- Options buttons will be injected here -->
                </div>

                <div id="feedback" class="feedback-container">
                    <!-- Feedback text will be injected here -->
                </div>

                <!-- Final Result Section (Hidden until last question) -->
                <div id="final-result-section" style="display: none; border-top: 2px solid #f3f4f6; padding-top: 25px; margin-top: 20px; text-align: center;">
                    <div id="result-icon" class="result-icon" style="font-size: 48px; margin-bottom: 15px;"></div>
                    <h2 id="score-display" class="score-display" style="font-size: 32px; margin: 10px 0;">0/7 Correct</h2>
                    <p id="result-message" style="margin-bottom: 25px; font-weight: 500;"></p>
                    <div class="challenge-actions" style="justify-content: center; gap: 15px;">
                        <button id="retry-btn" onclick="location.reload()" class="btn btn-outline" style="display: none;">Try Again</button>
                        <a id="collect-btn" href="mission.html" class="btn btn-yellow" style="display: none;">Collect Rewards!</a>
                    </div>
                </div>

                <div class="challenge-actions">
                    <button id="next-question-btn" class="btn btn-blue">Next <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script src="challenge.js"></script>
</body>
</html>
