<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brighterly - Parents Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .parents-dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            text-align: center;
        }
        .parents-dashboard h1 {
            font-size: 48px;
            color: var(--primary-blue);
            margin-bottom: 20px;
        }
        .parents-dashboard p {
            font-size: 18px;
            color: var(--text-gray);
            max-width: 600px;
        }
        .back-link {
            margin-top: 40px;
            color: var(--text-gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .back-link:hover {
            color: var(--primary-blue);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <img src="https://cs.brighterly.com/_nuxt/brighterly.CIV4ES6z.svg" alt="Brighterly">
            </div>
            <nav class="nav-links">
                <a href="index.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="#" class="nav-item">Subscription</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
            <div class="user-profile">
                <div class="parent-access" style="background-color: var(--primary-blue-light);">
                    <span class="icon ivan-icon"><i class="fas fa-user-shield"></i></span>
                    <span class="username">Ivan</span>
                </div>
                <div class="avatar">St</div>
                <span class="username">Stefaniia</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="parents-dashboard">
            <h1>hello Ivan</h1>
            <p>Welcome to the parents' portal. Here you can track Stefaniia's progress, manage subscriptions, and schedule lessons.</p>
            
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to kid's view</a>
        </div>
    </main>

    <script>
        // Simple script to handle back navigation and keeping active states
    </script>
</body>
</html>
