<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brighterly Demo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.login-page {
            background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .demo-notice {
            background: #fff9ea;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .login-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .login-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            color: #64748b;
            transition: all 0.2s;
        }
        .login-tab-btn.active {
            background: #fff;
            color: var(--text-dark);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-blue);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <img src="https://cs.brighterly.com/_nuxt/brighterly.CIV4ES6z.svg" alt="Brighterly" style="width: 180px; margin-bottom: 20px;">
        <h2>Start Your Adventure</h2>
        <p style="color: #64748b; margin-bottom: 25px;">Welcome to the Brighterly Demo Portal.</p>

        <div class="login-tabs">
            <button class="login-tab-btn active" onclick="switchLoginTab(event, 'tab-login')">Log In</button>
            <button class="login-tab-btn" onclick="switchLoginTab(event, 'tab-signup')">Sign Up</button>
        </div>

        <div class="demo-notice">
            <i class="fas fa-info-circle"></i>
            <span><strong>Demo Mode:</strong> Any inputs will trigger a mock session. Use for exploring the gamified dashboard.</span>
        </div>

        <!-- Log In Tab (Email Only) -->
        <div id="tab-login" class="tab-content active">
            <form onsubmit="handleDemoLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="e.g. parent@example.com" required>
                </div>
                <button type="submit" class="btn btn-blue" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 16px;">Log In <i class="fas fa-sign-in-alt" style="margin-left: 10px;"></i></button>
            </form>
        </div>

        <!-- Sign Up Tab (Full Details) -->
        <div id="tab-signup" class="tab-content">
            <form onsubmit="handleDemoLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="e.g. parent@example.com" required>
                </div>
                <div class="form-group">
                    <label>Parent Name</label>
                    <input type="text" placeholder="e.g. Ivan" required>
                </div>
                <div class="form-group">
                    <label>Kid Name</label>
                    <input type="text" placeholder="e.g. Stefaniia" required>
                </div>
                <div class="form-group">
                    <label>Kid Grade</label>
                    <select required>
                        <option value="">Select Grade</option>
                        <option value="Gk">Grade K (Pre-K)</option>
                        <option value="G1">Grade 1</option>
                        <option value="G2">Grade 2</option>
                        <option value="G3" selected>Grade 3</option>
                        <option value="G4">Grade 4</option>
                        <option value="G5">Grade 5</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-yellow" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 16px;">Create Account & Start <i class="fas fa-rocket" style="margin-left: 10px;"></i></button>
            </form>
        </div>
    </div>

    <script>
        function switchLoginTab(event, tabId) {
            // Update buttons
            document.querySelectorAll('.login-tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // Update content visibility
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function handleDemoLogin(event) {
            event.preventDefault();
            // Redirect to dashboard for demo purposes
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
